# All hooks run the tools already installed in the project venv (language: system)
# rather than pre-commit-managed environments — the work machine has no network
# access to build isolated hook envs, so everything must come from the offline
# wheelhouse install.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy src/nornir/
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit
        entry: bandit -q -c pyproject.toml -r src/nornir/
        language: system
        pass_filenames: false
        types: [python]
